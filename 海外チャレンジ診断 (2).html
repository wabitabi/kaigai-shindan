<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自分に合う海外チャレンジ診断</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#2EB4F0;
    --sky-deep:#0B6FB0;
    --sky-pale:#EAF8FF;
    --sun:#FFC93C;
    --coral:#FF7A59;
    --white:#FFFFFF;
    --ink:#0C3A57;
    --gray:#5D7488;
    --line:#CFEBFA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'M PLUS Rounded 1c','Zen Maru Gothic',sans-serif;
    background:
      radial-gradient(ellipse at 15% 8%, rgba(255,255,255,0.55), transparent 45%),
      radial-gradient(ellipse at 85% 92%, rgba(255,255,255,0.35), transparent 40%),
      linear-gradient(180deg, #6FD1FF 0%, #2EB4F0 38%, #1497DE 100%);
    min-height:100vh;
    color:var(--ink);
    overflow-x:hidden;
    position:relative;
  }

  /* ---- decorative sky elements ---- */
  .sky-decor{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;}
  .cloud{position:absolute; opacity:0.9; animation:drift 60s linear infinite;}
  .cloud svg{display:block; filter:drop-shadow(0 4px 10px rgba(11,111,176,0.12));}
  .cloud.c1{top:8%; left:-15%; width:180px; animation-duration:70s;}
  .cloud.c2{top:20%; left:-20%; width:120px; animation-duration:50s; animation-delay:-15s;}
  .cloud.c3{top:65%; left:-25%; width:150px; animation-duration:85s; animation-delay:-40s;}
  .cloud.c4{top:80%; left:-15%; width:100px; animation-duration:55s; animation-delay:-8s;}
  @keyframes drift{ from{transform:translateX(0);} to{transform:translateX(135vw);} }

  .plane-path{position:absolute; top:12%; left:0; width:100%; height:2px;}
  .plane{position:absolute; top:10%; left:-6%; font-size:26px; animation:fly 26s linear infinite; filter:drop-shadow(0 3px 6px rgba(11,60,87,0.25));}
  @keyframes fly{
    0%{ left:-6%; transform:translateY(0) rotate(8deg);}
    50%{ left:52%; transform:translateY(-18px) rotate(4deg);}
    100%{ left:112%; transform:translateY(0) rotate(8deg);}
  }
  .dot-route{position:absolute; top:16%; left:0; width:100%; height:40px; border-top:3px dashed rgba(255,255,255,0.55);}

  .stamp{position:absolute; border:3px solid rgba(255,255,255,0.35); border-radius:50%; width:70px; height:70px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:rgba(255,255,255,0.45); transform:rotate(-18deg); letter-spacing:0.05em;}
  .stamp.s1{top:38%; left:6%;}
  .stamp.s2{top:70%; right:8%; transform:rotate(14deg);}

  /* ---- app shell ---- */
  .app{position:relative; z-index:1; max-width:640px; margin:0 auto; padding:28px 18px 60px;}

  .brand{display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:18px;}
  .brand .badge{
    background:var(--white); color:var(--sky-deep); font-weight:800; font-size:13px;
    padding:6px 14px; border-radius:999px; box-shadow:0 4px 14px rgba(11,60,87,0.18);
    letter-spacing:0.04em; display:flex; align-items:center; gap:6px;
  }

  .card{
    background:var(--white);
    border-radius:26px;
    padding:32px 26px;
    box-shadow:0 18px 40px rgba(11,60,87,0.22);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute; top:-40px; right:-40px; width:140px; height:140px;
    background:radial-gradient(circle, rgba(255,201,60,0.35), transparent 70%);
  }

  /* ---- start screen ---- */
  .hero-emoji{font-size:52px; text-align:center; margin-bottom:6px;}
  h1.hero-title{
    font-family:'Zen Maru Gothic', sans-serif; font-weight:900;
    font-size:26px; text-align:center; line-height:1.5; color:var(--sky-deep); margin:0 0 10px;
  }
  h1.hero-title .hl{color:var(--coral);}
  p.hero-sub{text-align:center; color:var(--gray); font-size:14.5px; line-height:1.8; margin:0 0 26px;}
  .hero-badges{display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-bottom:28px;}
  .hero-badges span{
    background:var(--sky-pale); color:var(--sky-deep); font-size:12px; font-weight:700;
    padding:6px 12px; border-radius:999px; border:1.5px solid var(--line);
  }
  .btn-primary{
    display:block; width:100%; text-align:center;
    background:linear-gradient(180deg, var(--sun), #FFB300);
    color:#7A4B00; font-weight:800; font-size:17px;
    border:none; border-radius:18px; padding:16px 20px; cursor:pointer;
    box-shadow:0 10px 0 #E39A00, 0 16px 24px rgba(227,154,0,0.35);
    transition:transform 0.08s ease;
    font-family:inherit;
  }
  .btn-primary:active{transform:translateY(6px); box-shadow:0 4px 0 #E39A00, 0 8px 16px rgba(227,154,0,0.3);}
  .btn-secondary{
    display:block; width:100%; text-align:center; margin-top:12px;
    background:var(--white); color:var(--sky-deep); font-weight:700; font-size:15px;
    border:2px solid var(--line); border-radius:16px; padding:13px 18px; cursor:pointer;
    font-family:inherit;
  }

  /* ---- progress ---- */
  .progress-wrap{display:flex; align-items:center; gap:10px; margin-bottom:22px;}
  .progress-label{font-size:12px; font-weight:800; color:var(--sky-deep); white-space:nowrap; background:var(--sky-pale); padding:5px 10px; border-radius:999px;}
  .progress-track{flex:1; height:10px; background:var(--sky-pale); border-radius:999px; overflow:hidden;}
  .progress-fill{height:100%; background:linear-gradient(90deg, var(--sun), var(--coral)); border-radius:999px; transition:width 0.4s ease;}

  .q-text{
    font-family:'Zen Maru Gothic', sans-serif; font-weight:700; font-size:19px;
    line-height:1.6; color:var(--ink); margin:0 0 22px;
  }
  .options{display:flex; flex-direction:column; gap:11px;}
  .option-btn{
    text-align:left; background:var(--sky-pale); border:2px solid transparent;
    border-radius:16px; padding:14px 16px; font-size:14.5px; font-weight:600; color:var(--ink);
    cursor:pointer; transition:all 0.15s ease; font-family:inherit; line-height:1.55;
    display:flex; align-items:center; gap:10px;
  }
  .option-btn:hover{border-color:var(--sky); background:#DEF3FF; transform:translateX(2px);}
  .option-btn .letter{
    flex-shrink:0; width:26px; height:26px; border-radius:50%; background:var(--white);
    color:var(--sky-deep); font-weight:800; font-size:12px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 4px rgba(11,60,87,0.15);
  }

  /* ---- boarding pass result ---- */
  .pass{
    background:linear-gradient(135deg, var(--sky-deep), var(--sky));
    border-radius:22px; color:#fff; padding:0; overflow:hidden; margin-bottom:18px;
    box-shadow:0 14px 30px rgba(11,60,87,0.3);
  }
  .pass-top{padding:20px 22px 16px;}
  .pass-eyebrow{font-size:11px; font-weight:800; letter-spacing:0.14em; color:#CDEEFF; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;}
  .pass-eyebrow .plane-mini{font-size:14px;}
  .pass-type{font-family:'Zen Maru Gothic',sans-serif; font-weight:900; font-size:24px; line-height:1.4;}
  .pass-sub{font-size:12.5px; color:#DDF3FF; margin-top:6px; line-height:1.7;}
  .pass-divider{
    position:relative; height:0; border-top:2.5px dashed rgba(255,255,255,0.45); margin:0 22px;
  }
  .pass-divider::before,.pass-divider::after{
    content:""; position:absolute; top:-11px; width:22px; height:22px; background:var(--sky-pale); border-radius:50%;
  }
  .pass-divider::before{left:-33px;}
  .pass-divider::after{right:-33px;}
  .pass-bottom{padding:16px 22px 22px; display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap;}
  .pass-field{font-size:10.5px; color:#CDEEFF; font-weight:700; letter-spacing:0.06em;}
  .pass-field b{display:block; font-size:15px; color:#fff; margin-top:3px; font-family:'Zen Maru Gothic',sans-serif;}

  .result-desc-card{
    background:var(--sky-pale); border-radius:18px; padding:18px 20px; margin-bottom:18px;
    font-size:13.5px; line-height:1.85; color:var(--ink);
  }
  .result-desc-card .lbl{font-size:11px; font-weight:800; color:var(--coral); letter-spacing:0.05em; margin-bottom:6px; display:block;}

  .type-pick-grid{display:flex; flex-direction:column; gap:10px; margin-bottom:6px;}
  .type-pick-btn{
    background:var(--white); border:2px solid var(--line); border-radius:16px;
    padding:14px 16px; text-align:left; cursor:pointer; font-family:inherit;
    display:flex; align-items:center; gap:12px; transition:all 0.15s ease;
  }
  .type-pick-btn:hover{border-color:var(--sky); background:var(--sky-pale);}
  .type-pick-btn .emoji{font-size:26px;}
  .type-pick-btn .name{font-weight:800; font-size:15px; color:var(--sky-deep); font-family:'Zen Maru Gothic',sans-serif;}

  .footer-note{text-align:center; color:rgba(255,255,255,0.85); font-size:11.5px; margin-top:22px; line-height:1.7;}
  .footer-note a{color:#fff; font-weight:700;}

  @media (max-width:420px){
    .card{padding:26px 18px;}
    h1.hero-title{font-size:22px;}
    .pass-type{font-size:20px;}
  }
</style>
</head>
<body>

<div class="sky-decor">
  <div class="dot-route"></div>
  <div class="plane">✈️</div>
  <div class="cloud c1"><svg viewBox="0 0 200 100" width="180"><path d="M30 70 Q10 70 10 55 Q10 40 28 40 Q30 20 55 20 Q78 20 82 38 Q100 35 105 52 Q120 52 120 65 Q120 78 105 78 L35 78 Q30 78 30 70Z" fill="#fff"/></svg></div>
  <div class="cloud c2"><svg viewBox="0 0 200 100" width="120"><path d="M30 70 Q10 70 10 55 Q10 40 28 40 Q30 20 55 20 Q78 20 82 38 Q100 35 105 52 Q120 52 120 65 Q120 78 105 78 L35 78 Q30 78 30 70Z" fill="#fff"/></svg></div>
  <div class="cloud c3"><svg viewBox="0 0 200 100" width="150"><path d="M30 70 Q10 70 10 55 Q10 40 28 40 Q30 20 55 20 Q78 20 82 38 Q100 35 105 52 Q120 52 120 65 Q120 78 105 78 L35 78 Q30 78 30 70Z" fill="#fff"/></svg></div>
  <div class="cloud c4"><svg viewBox="0 0 200 100" width="100"><path d="M30 70 Q10 70 10 55 Q10 40 28 40 Q30 20 55 20 Q78 20 82 38 Q100 35 105 52 Q120 52 120 65 Q120 78 105 78 L35 78 Q30 78 30 70Z" fill="#fff"/></svg></div>

<div class="app">

  <div class="card" id="card"></div>

</div>

      'インド':'テック分野を中心に、新興国のスピード感の中で力を試したい人向け。',
      'アメリカ・ヨーロッパ':'最先端のテックや金融ビジネスの現場に挑戦したい、英語力に自信のある人向け。',
    },
    questions: [
      { text:'働く環境のイメージは？', options:[
        { label:'急成長中のスタートアップ', scores:{'ベトナム':2,'インド':2} },
        { label:'大手グローバル企業', scores:{'シンガポール':2,'アメリカ・ヨーロッパ':2} },
      ]},
      { text:'求める空気感は？', options:[
        { label:'新興国のエネルギー', scores:{'ベトナム':2,'インド':2} },
        { label:'先進国の整った環境', scores:{'シンガポール':2,'アメリカ・ヨーロッパ':2} },
      ]},
      { text:'生活コストについて', options:[
        { label:'抑えたい', scores:{'ベトナム':2,'インド':2} },
        { label:'多少かかってもいい', scores:{'シンガポール':2,'アメリカ・ヨーロッパ':2} },
      ]},
      { text:'英語力について', options:[
        { label:'まだ自信がない', scores:{'ベトナム':2} },
        { label:'試してみたい', scores:{'シンガポール':2,'インド':1,'アメリカ・ヨーロッパ':2} },
      ]},
      { text:'将来つなげたい分野は？', options:[
        { label:'社会課題解決系', scores:{'ベトナム':2,'インド':1} },
        { label:'金融・ビジネス系', scores:{'シンガポール':2,'アメリカ・ヨーロッパ':1} },
        { label:'テック系', scores:{'インド':2,'アメリカ・ヨーロッパ':2,'シンガポール':1} },
      ]},
      { text:'会社の規模感は？', options:[
        { label:'少人数でスピード感のある環境', scores:{'ベトナム':2,'インド':2} },
        { label:'組織立った環境でしっかり学びたい', scores:{'シンガポール':2,'アメリカ・ヨーロッパ':2} },
      ]},
      { text:'生活環境について', options:[
        { label:'多少不便でも気にしない', scores:{'ベトナム':2,'インド':2} },
        { label:'整った生活環境がいい', scores:{'シンガポール':2,'アメリカ・ヨーロッパ':2} },
      ]},
      { text:'インターン後のキャリアイメージは？', options:[
        { label:'新興国のビジネスに関わり続けたい', scores:{'ベトナム':2,'インド':2} },
        { label:'グローバル企業でキャリアを積みたい', scores:{'シンガポール':2,'アメリカ・ヨーロッパ':2} },
      ]},
    ]
  },
};

/* ====================== STATE ====================== */

let state = {
  screen: 'start',            // start | typeQuiz | typeResult | pickType | countryQuiz | countryResult
  typeQIndex: 0,
  typeScores: {},
  shuffledTypeOptions: [],    // shuffled per question, built at quiz start
  topTypes: [],
  chosenType: null,
  countryQIndex: 0,
  countryScores: {},
  shuffledCountryOptions: [],
};

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* ====================== RENDER ====================== */

const cardEl = document.getElementById('card');
const footerEl = document.getElementById('footerNote');

function render(){
  footerEl.innerHTML = '';
  if(state.screen === 'start') return renderStart();
  if(state.screen === 'typeQuiz') return renderTypeQuiz();
  if(state.screen === 'typeResult') return renderTypeResult();
  if(state.screen === 'pickType') return renderPickType();
  if(state.screen === 'countryQuiz') return renderCountryQuiz();
  if(state.screen === 'countryResult') return renderCountryResult();
}

function renderStart(){
  cardEl.innerHTML = `
    <div class="hero-emoji">🌍✈️</div>
    <h1 class="hero-title">自分に合う<span class="hl">海外チャレンジ</span>、<br>見つけよう</h1>
    <p class="hero-sub">全28問の質問に答えると、あなたにぴったりの海外挑戦スタイルと、<br>相性のいい国までじっくり診断します。</p>
    <div class="hero-badges">
      <span>🎓 大学進学</span><span>📚 語学留学</span><span>🧳 ワーホリ</span>
      <span>🗺️ 一人旅</span><span>🤝 ボランティア</span><span>💼 インターン</span>
    </div>
    <button class="btn-primary" id="startBtn">診断をはじめる（所要時間 約15分）</button>
  `;
  document.getElementById('startBtn').onclick = () => {
    state.typeScores = {};
    TYPE_KEYS.forEach(k => state.typeScores[k]=0);
    state.typeQIndex = 0;
    state.shuffledTypeOptions = TYPE_QUESTIONS.map(q => shuffle(q.options));
    state.screen = 'typeQuiz';
    render();
  };
}

function renderTypeQuiz(){
  const idx = state.typeQIndex;
  const q = TYPE_QUESTIONS[idx];
  const opts = state.shuffledTypeOptions[idx];
  const pct = Math.round((idx/TYPE_QUESTIONS.length)*100);
  const letters = ['A','B','C','D','E','F'];
  cardEl.innerHTML = `
    <div class="progress-wrap">
      <span class="progress-label">TYPE Q${idx+1}/${TYPE_QUESTIONS.length}</span>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <p class="q-text">${q.text}</p>
    <div class="options">
      ${opts.map((o,i)=>`<button class="option-btn" data-i="${i}"><span class="letter">${letters[i]}</span>${o.label}</button>`).join('')}
    </div>
  `;
  cardEl.querySelectorAll('.option-btn').forEach(btn=>{
    btn.onclick = () => {
      const o = opts[parseInt(btn.dataset.i)];
      state.typeScores[o.type] += 1;
      if(idx+1 < TYPE_QUESTIONS.length){
        state.typeQIndex += 1;
        render();
      } else {
        finishTypeQuiz();
      }
    };
  });
}

function finishTypeQuiz(){
  const max = Math.max(...Object.values(state.typeScores));
  state.topTypes = TYPE_KEYS.filter(k => state.typeScores[k] === max);
  state.screen = 'typeResult';
  render();
}

function renderTypeResult(){
  const multi = state.topTypes.length > 1;
  const listHtml = state.topTypes.map(t => `${TYPE_META[t].emoji} ${TYPE_META[t].label}`).join('　／　');
  cardEl.innerHTML = `
    <div class="pass">
      <div class="pass-top">
        <div class="pass-eyebrow"><span>BOARDING PASS · TYPE DIAGNOSIS</span><span class="plane-mini">✈️</span></div>
        <div class="pass-type">${listHtml}</div>
        <div class="pass-sub">${multi ? 'あなたには複数のタイプが同じくらい向いています' : 'あなたに一番向いている海外挑戦タイプです'}</div>
      </div>
      <div class="pass-divider"></div>
      <div class="pass-bottom">
        <div class="pass-field">FROM<b>あなたの「好き」</b></div>
        <div class="pass-field">TO<b>次の一歩</b></div>
        <div class="pass-field">CLASS<b>CHALLENGE</b></div>
      </div>
    </div>
    ${state.topTypes.map(t=>`
      <div class="result-desc-card">
        <span class="lbl">${TYPE_META[t].emoji} ${TYPE_META[t].label}</span>
        ${TYPE_RESULT_DESC[t]}
      </div>
    `).join('')}
    <button class="btn-primary" id="toCountryBtn">${multi ? 'タイプを選んで国診断へ進む' : 'このタイプで国診断に進む'}</button>
    <button class="btn-secondary" id="restartBtn1">最初からやり直す</button>
  `;
  document.getElementById('toCountryBtn').onclick = () => {
    if(multi){
      state.screen = 'pickType';
    } else {
      state.chosenType = state.topTypes[0];
      startCountryQuiz();
      return;
    }
    render();
  };
  document.getElementById('restartBtn1').onclick = resetAll;
}

function renderPickType(){
  cardEl.innerHTML = `
    <p class="q-text">どちらのタイプで国診断を進めますか？</p>
    <div class="type-pick-grid">
      ${state.topTypes.map(t=>`
        <button class="type-pick-btn" data-t="${t}">
          <span class="emoji">${TYPE_META[t].emoji}</span>
          <span class="name">${TYPE_META[t].label}</span>
        </button>
      `).join('')}
    </div>
  `;
  cardEl.querySelectorAll('.type-pick-btn').forEach(btn=>{
    btn.onclick = () => {
      state.chosenType = btn.dataset.t;
      startCountryQuiz();
    };
  });
}

function startCountryQuiz(){
  const data = COUNTRY_DATA[state.chosenType];
  state.countryScores = {};
  data.countries.forEach(c => state.countryScores[c] = 0);
  state.countryQIndex = 0;
  state.shuffledCountryOptions = data.questions.map(q => shuffle(q.options));
  state.screen = 'countryQuiz';
  render();
}

function renderCountryQuiz(){
  const data = COUNTRY_DATA[state.chosenType];
  const idx = state.countryQIndex;
  const q = data.questions[idx];
  const opts = state.shuffledCountryOptions[idx];
  const pct = Math.round((idx/data.questions.length)*100);
  const letters = ['A','B','C','D'];
  cardEl.innerHTML = `
    <div class="progress-wrap">
      <span class="progress-label">${TYPE_META[state.chosenType].emoji} COUNTRY Q${idx+1}/${data.questions.length}</span>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <p class="q-text">${q.text}</p>
    <div class="options">
      ${opts.map((o,i)=>`<button class="option-btn" data-i="${i}"><span class="letter">${letters[i]}</span>${o.label}</button>`).join('')}
    </div>
  `;
  cardEl.querySelectorAll('.option-btn').forEach(btn=>{
    btn.onclick = () => {
      const o = opts[parseInt(btn.dataset.i)];
      Object.keys(o.scores).forEach(c => { state.countryScores[c] += o.scores[c]; });
      if(idx+1 < data.questions.length){
        state.countryQIndex += 1;
        render();
      } else {
        finishCountryQuiz();
      }
    };
  });
}

function finishCountryQuiz(){
  state.screen = 'countryResult';
  render();
}

function renderCountryResult(){
  const data = COUNTRY_DATA[state.chosenType];
  const max = Math.max(...Object.values(state.countryScores));
  const topCountries = data.countries.filter(c => state.countryScores[c] === max).slice(0,2);
  const meta = TYPE_META[state.chosenType];
  cardEl.innerHTML = `
    <div class="pass">
      <div class="pass-top">
        <div class="pass-eyebrow"><span>BOARDING PASS · COUNTRY DIAGNOSIS</span><span class="plane-mini">✈️</span></div>
        <div class="pass-type">${topCountries.join('　／　')}</div>
        <div class="pass-sub">${meta.emoji} ${meta.label}タイプのあなたに合う渡航先です</div>
      </div>
      <div class="pass-divider"></div>
      <div class="pass-bottom">
        <div class="pass-field">TYPE<b>${meta.code}</b></div>
        <div class="pass-field">DESTINATION<b>${topCountries[0]}</b></div>
        <div class="pass-field">STATUS<b>READY</b></div>
      </div>
    </div>
    ${topCountries.map(c=>`
      <div class="result-desc-card">
        <span class="lbl">🌏 ${c}</span>
        ${data.desc[c]}
      </div>
    `).join('')}
    <button class="btn-primary" id="restartBtn2">もう一度診断する</button>
  `;
  document.getElementById('restartBtn2').onclick = resetAll;
}

function resetAll(){
  state = {
    screen: 'start', typeQIndex:0, typeScores:{}, shuffledTypeOptions:[],
    topTypes:[], chosenType:null, countryQIndex:0, countryScores:{}, shuffledCountryOptions:[],
  };
  render();
}

render();
</script>
